<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر إلكتروني</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>متجر الساعات الفاخرة</h1>
        <input type="text" placeholder="ابحث عن منتجك..." id="searchBox">
    </header>
    <section id="products">
        <div class="product">
            <img src="watch1.jpg" alt="Patek Philippe">
            <h2>Patek Philippe</h2>
            <p class="price">7500 دج <span class="old-price">8700 دج</span></p>
            <button class="order-btn">أطلب الآن</button>
            <div class="contact-icons">
                <a href="#"><img src="whatsapp.png" alt="WhatsApp"></a>
                <a href="#"><img src="messenger.png" alt="Messenger"></a>
            </div>
        </div>
        <div class="product">
            <img src="watch2.jpg" alt="Rolex">
            <h2>Rolex</h2>
            <p class="price">8900 دج <span class="old-price">12500 دج</span></p>
            <button class="order-btn">أطلب الآن</button>
            <div class="contact-icons">
                <a href="#"><img src="whatsapp.png" alt="WhatsApp"></a>
                <a href="#"><img src="messenger.png" alt="Messenger"></a>
            </div>
        </div>
    </section>
    <footer>
        <p>© 2025 جميع الحقوق محفوظة</p>
    </footer>
</body>
</html>
